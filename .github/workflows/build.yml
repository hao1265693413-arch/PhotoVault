name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Compile
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios16.0 -swift-version 5 -O -module-name Vault -parse-as-library Vault.swift -o Vault
          ls -lh Vault

      - name: Package ipa
        run: |
          set -euo pipefail
          APP=Payload/Vault.app
          mkdir -p "$APP"
          cp Vault "$APP/Vault"
          cp icons/AppIcon60x60@3x.png "$APP/"
          cp icons/AppIcon60x60@2x.png "$APP/"
          echo  | base64 -d > "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          zip -qry Vault.ipa Payload
          ls -lh Vault.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-ipa
          path: Vault.ipa
          if-no-files-found: error
